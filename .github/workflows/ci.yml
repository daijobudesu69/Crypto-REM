name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "**.md", "research/**", "reports/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"     # konektivitas dicek harian walau tidak ada push

jobs:
  # Gerbang sesungguhnya: offline, deterministik, tanpa jaringan.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/test_connectivity.py

  # Pemantauan, bukan gerbang: API yang sedang down tidak boleh membuat badge
  # merah seolah strateginya rusak.
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_connectivity.py -s
